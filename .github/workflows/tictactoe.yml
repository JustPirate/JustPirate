name: TicTacToe Game Engine

on:
  issues:
    types: [opened]

jobs:
  play:
    if: startsWith(github.event.issue.title, 'ttt|')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Process Move
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_USER: ${{ github.event.issue.user.login }}
        run: |
          python3 scripts/tictactoe.py

      - name: Commit and Push Board Update
        run: |
          git config --global user.name "JustPirate Bot"
          git config --global user.email "bot@justpirate.dev"
          git add README.md
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "game: move by @${{ github.event.issue.user.login }} [skip ci]"
            git push
          fi

      - name: Close Issue with Response
        uses: actions/github-script@v7
        with:
          script: |
            const user = context.payload.issue.user.login;
            const title = context.payload.issue.title;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body: `⚔️ **Move registered!** Thanks for playing @${user}. The board on the profile has been updated.`
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              state: 'closed',
              state_reason: 'completed'
            });
